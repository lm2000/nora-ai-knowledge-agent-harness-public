<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public source release path</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #eaf0f6; color: #182d48; font: 16px/1.4 system-ui, sans-serif; }
  .diagram-container { box-sizing: border-box; width: min(100%, 1100px); padding: 28px; margin: 0 auto; background: #fff; }
  h1 { font-size: 25px; margin: 0 0 5px; }
  p { margin: 0 0 15px; color: #344a64; }
  svg { width: 100%; height: auto; display: block; }
  .node { fill: #f5f8fc; stroke: #6380a4; stroke-width: 1.6; }
  .node-final { fill: #e6f4ee; stroke: #268673; stroke-width: 1.6; }
  .heading { fill: #182d48; font-size: 17px; font-weight: 700; text-anchor: middle; }
  .sub { fill: #344a64; font-size: 13px; text-anchor: middle; }
  .arrow { fill: none; stroke: #7189a5; stroke-width: 2; marker-end: url(#arrowhead); }
  .note { margin: 12px 0 0; font-size: 14px; }
</style>
<main class="diagram-container">
  <h1>Public source release</h1>
  <p>Reviewed source is copied through an explicit allowlist into a separate public repository.</p>
  <svg viewBox="0 0 1040 230" role="img" aria-labelledby="release-title release-desc">
    <title id="release-title">Private harness to public source repository</title>
    <desc id="release-desc">Private source is filtered by a release manifest. The clean snapshot is validated and inspected, then copied to the separate public repository. Private history and operator records stay outside the snapshot.</desc>
    <defs><marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#7189a5"/></marker></defs>
    <rect class="node" x="8" y="36" width="215" height="108" rx="10"/>
    <text class="heading" x="115" y="76">Private source</text>
    <text class="sub" x="115" y="104">Application and docs</text>
    <path class="arrow" d="M225 90H263"/>
    <rect class="node" x="267" y="36" width="220" height="108" rx="10"/>
    <text class="heading" x="377" y="76">Release allowlist</text>
    <text class="sub" x="377" y="104">Select and scan files</text>
    <path class="arrow" d="M489 90H527"/>
    <rect class="node" x="531" y="36" width="220" height="108" rx="10"/>
    <text class="heading" x="641" y="76">Clean snapshot</text>
    <text class="sub" x="641" y="104">Validate and inspect</text>
    <path class="arrow" d="M753 90H791"/>
    <rect class="node-final" x="795" y="36" width="235" height="108" rx="10"/>
    <text class="heading" x="912" y="76">Public repository</text>
    <text class="sub" x="912" y="104">Separate commit and readback</text>
    <path d="M8 177H1030" stroke="#bdcddd"/>
    <text class="sub" x="520" y="205">Private Git history, credentials and operator records remain outside the snapshot.</text>
  </svg>
  <p class="note">Publication updates source files only. Running services and the website have separate procedures.</p>
</main>
</html>
