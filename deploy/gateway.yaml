model_list:
  - model_name: nora-ollama
    litellm_params:
      model: ollama_chat/glm-5.3-flash
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY
mcp_servers:
  web:
    url: http://127.0.0.1:4000/internal-web/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/LITELLM_MASTER_KEY
  nis:
    url: os.environ/NIS_MCP_URL
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/NIS_UPSTREAM_TOKEN
  retrieval:
    url: os.environ/NIS_RETRIEVAL_URL
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/NIS_RETRIEVAL_TOKEN
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_prisma_schema_update: true
litellm_settings:
  telemetry: false
